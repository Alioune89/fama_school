name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database:
    name: Base de données (migrations + RLS pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase db start
        env:
          SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci
      - run: supabase test db

  e2e:
    name: Parcours de bout en bout (Playwright)
    needs: [quality, database]
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci
      # Paiement en ligne de démonstration (fermé par défaut).
      ONLINE_PAYMENT_PROVIDER: simulated
      # Envoi des notifications par SMS et WhatsApp simulé (fermé par défaut).
      NOTIFICATION_CHANNELS: log
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime
      - run: npm run db:env
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
