name: Staging

# Inactif tant que les variables STAGING_PROJECT_REF et STAGING_URL ne sont pas définies
# (voir docs/deploiement-staging.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrations Supabase (staging)
    if: vars.STAGING_PROJECT_REF != ''
    runs-on: ubuntu-latest
    env:
      # Sans mot de passe, le CLI passe par un rôle temporaire obtenu avec le jeton (comme en local).
      # Avec SUPABASE_DB_PASSWORD, il viserait l'hôte direct de la base, joignable seulement en IPv6,
      # ce que les machines GitHub Actions ne savent pas faire.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase link --project-ref "${{ vars.STAGING_PROJECT_REF }}"
      # N'applique que les migrations manquantes ; le seed n'est jamais rejoué ici.
      - run: supabase db push

  smoke:
    name: Parcours essentiels sur le site en ligne
    needs: migrate
    if: always() && vars.STAGING_URL != '' && needs.migrate.result != 'failure'
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ vars.STAGING_URL }}
      E2E_DEMO_PASSWORD: ${{ secrets.STAGING_DEMO_PASSWORD }}
    steps:
      # Vercel déploie chaque push de son côté : on attend que le staging serve ce commit (30 min au plus : la file Vercel dépasse parfois 15 min).
      - name: Attendre le déploiement Vercel de ce commit
        run: |
          for attempt in $(seq 1 120); do
            served=$(curl -fsS "$E2E_BASE_URL/api/health" | jq -r '.commit // empty' || true)
            if [ "$served" = "$GITHUB_SHA" ]; then echo "Commit $GITHUB_SHA en ligne."; exit 0; fi
            echo "En ligne : ${served:-inconnu} ; attendu : $GITHUB_SHA (essai $attempt/120)"
            sleep 15
          done
          echo "::error::Le staging ne sert toujours pas $GITHUB_SHA après 30 minutes (déploiement Vercel en échec ?)."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-staging
          path: playwright-report
          retention-days: 7
